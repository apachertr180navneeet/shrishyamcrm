<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Navy Ring -->
  <circle cx="250" cy="250" r="230" fill="url(#navyGrad)" filter="url(#shadow)"/>
  
  <!-- Outer Gold Border -->
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="12 6"/>
  <circle cx="250" cy="250" r="212" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Rays / Sunburst Background -->
  <g opacity="0.15" stroke="url(#goldGrad)" stroke-width="2">
    <line x1="250" y1="50" x2="250" y2="450"/>
    <line x1="50" y1="250" x2="450" y2="250"/>
    <line x1="108" y1="108" x2="392" y2="392"/>
    <line x1="108" y1="392" x2="392" y2="108"/>
  </g>

  <!-- Inner Concentric Circle -->
  <circle cx="250" cy="250" r="160" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="5"/>

  <!-- Lotus Flower Base -->
  <path d="M 180,270 Q 250,330 320,270 Q 280,310 250,310 Q 220,310 180,270 Z" fill="url(#saffronGrad)"/>
  <path d="M 190,260 C 170,220 210,190 230,230 C 210,240 200,250 190,260 Z" fill="url(#goldGrad)"/>
  <path d="M 310,260 C 330,220 290,190 270,230 C 290,240 300,250 310,260 Z" fill="url(#goldGrad)"/>
  <path d="M 220,270 C 200,210 250,170 250,220 C 250,170 300,210 280,270 C 260,285 240,285 220,270 Z" fill="url(#saffronGrad)"/>

  <!-- Central Sacred Peacock Feather / Crown Symbol -->
  <path d="M 250,135 C 225,135 210,160 210,185 C 210,215 250,245 250,245 C 250,245 290,215 290,185 C 290,160 275,135 250,135 Z" fill="url(#navyGrad)"/>
  <ellipse cx="250" cy="180" rx="22" ry="30" fill="url(#goldGrad)"/>
  <ellipse cx="250" cy="185" rx="12" ry="18" fill="#1E3A8A"/>
  <circle cx="250" cy="188" r="6" fill="url(#saffronGrad)"/>

  <!-- Tilak Symbol on Top -->
  <path d="M 242,125 Q 250,105 258,125 Q 250,120 242,125 Z" fill="url(#saffronGrad)"/>
  <circle cx="250" cy="100" r="5" fill="url(#goldGrad)"/>

  <!-- Circular Hindi Text Arc (Top) -->
  <path id="textArcTop" d="M 75,250 A 175,175 0 1,1 425,250" fill="none"/>
  <text font-family="'Hind', 'Mukta', 'Arial', sans-serif" font-weight="700" font-size="21" fill="url(#goldGrad)">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      श्री श्याम वेलफेयर सोसायटी लोहीकी
    </textPath>
  </text>

  <!-- Circular English Text Arc (Bottom) -->
  <path id="textArcBottom" d="M 425,250 A 175,175 0 0,1 75,250" fill="none"/>
  <text font-family="'Outfit', 'Inter', 'Arial', sans-serif" font-weight="700" font-size="16" letter-spacing="2" fill="#FFFFFF">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      SHRI SHYAM WELFARE SOCIETY
    </textPath>
  </text>

  <!-- Decorative Stars -->
  <polygon points="68,250 72,242 80,250 72,258" fill="url(#goldGrad)"/>
  <polygon points="432,250 424,242 420,250 424,258" fill="url(#goldGrad)"/>
</svg>
